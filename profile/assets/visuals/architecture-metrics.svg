<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%">
  <defs>
    <linearGradient id="metBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="960" height="210" rx="16" fill="url(#metBg)"/>
  <rect x="1" y="1" width="958" height="208" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Card 1: Autonomous Orchestration -->
  <g transform="translate(24, 24)">
    <rect width="290" height="162" rx="12" fill="url(#cardGrad1)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">⚡</text>
    <text x="48" y="34" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Autonomous Core</text>
    
    <text x="20" y="70" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Multi-Account 429 Failover</text>
    <text x="20" y="94" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Dynamic Token Injection</text>
    <text x="20" y="118" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Continuous Agent Execution</text>
    <text x="20" y="142" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">STATUS: ZERO DOWNTIME</text>
  </g>

  <!-- Card 2: Engineering Ethos -->
  <g transform="translate(334, 24)">
    <rect width="290" height="162" rx="12" fill="url(#cardGrad2)" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#A855F7" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#A855F7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🏛️</text>
    <text x="48" y="34" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Systems &amp; Architecture</text>
    
    <text x="20" y="70" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Minimal Code &amp; YAGNI Philosophy</text>
    <text x="20" y="94" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Zero-SPOF Decoupled Services</text>
    <text x="20" y="118" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Reactive State &amp; Streaming APIs</text>
    <text x="20" y="142" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">GRADE: HIGH RESILIENCE</text>
  </g>

  <!-- Card 3: Security & Guardrails -->
  <g transform="translate(644, 24)">
    <rect width="292" height="162" rx="12" fill="url(#cardGrad3)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="28" cy="30" r="12" fill="#10B981" fill-opacity="0.2"/>
    <text x="28" y="34" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🔒</text>
    <text x="48" y="34" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Security &amp; Delivery</text>
    
    <text x="20" y="70" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• DPAPI Token Storage &amp; No-Leak .env</text>
    <text x="20" y="94" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Zero AI-Attribution Git Commits</text>
    <text x="20" y="118" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">• Rigorous Verification &amp; CI/CD</text>
    <text x="20" y="142" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">VERIFIED: SAFE AUTOMATION</text>
