  <text x="94" y="182" fill="#F5F3FF" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11">Motor Dual de Mapeo y Núcleo Autónomo</text>

