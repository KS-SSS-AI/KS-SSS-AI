  <text x="94" y="306" fill="#F5F3FF" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11">Despliegue de 10 Idiomas y Lanzamiento Limpio</text>

  <path d="M24 380H456" stroke="#30354A"/>
  <text x="24" y="398" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="start">SOLO DATOS PÚBLICOS</text>
  <text x="456" y="398" fill="#98A2B8" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="10" font-weight="400" text-anchor="end">Estado a 2026-09-20</text>
