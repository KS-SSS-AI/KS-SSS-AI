<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" fill="none" role="img" direction="ltr">
  <title>Roadmap de Desarrollo</title>
  <desc>Pipeline · Plan / Construcción / Verificación / Entrega</desc>
  <defs>
    <linearGradient id="surface2" x1="0" y1="0" x2="480" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17112B"/>
      <stop offset=".54" stop-color="#101926"/>
      <stop offset="1" stop-color="#0D1E1D"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect x=".5" y=".5" width="479" height="419" rx="22" fill="url(#surface2)" stroke="#30354A"/>
  <circle cx="424" cy="62" r="62" fill="#7C3AED" fill-opacity=".14" filter="url(#glow2)"/>
  <circle cx="54" cy="378" r="66" fill="#06B6D4" fill-opacity=".09" filter="url(#glow2)"/>

  <text x="24" y="31" fill="#F5F3FF" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="start">Roadmap de Desarrollo</text>
  <text x="24" y="49" fill="#AAB2C4" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="10" font-weight="400" text-anchor="start">Pipeline · Plan / Construcción / Verificación / Entrega</text>

  <rect x="346" y="18" width="110" height="28" rx="14" fill="#0B1020" stroke="#C4B5FD" stroke-opacity=".42"/>
  <circle cx="365" cy="32" r="4" fill="#67E8F9"/>
  <text x="377" y="36" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="start">Ver Flujo</text>

  <!-- Track rail -->
  <path d="M52 96V342" stroke="#4C4668" stroke-width="2" stroke-linecap="round"/>

  <!-- Stage 1: PLAN -->
  <circle cx="52" cy="106" r="9" fill="#111827" stroke="#C4B5FD" stroke-width="2"/><circle cx="52" cy="106" r="3" fill="#C4B5FD"/>
  <rect x="76" y="79" width="380" height="58" rx="14" fill="#111827" stroke="#C4B5FD" stroke-opacity=".42"/>
  <text x="94" y="98" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="13" font-weight="700">PLAN</text>
  <text x="94" y="120" fill="#F5F3FF" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11">Definición de Arquitectura Zero-SPOF</text>

  <!-- Stage 2: BUILD -->
  <circle cx="52" cy="168" r="9" fill="#111827" stroke="#67E8F9" stroke-width="2"/><circle cx="52" cy="168" r="3" fill="#67E8F9"/>
  <rect x="76" y="141" width="380" height="58" rx="14" fill="#111827" stroke="#67E8F9" stroke-opacity=".42"/>
