<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%">
  <defs>
    <style>
      .term-bg { fill: #0B0F19; stroke: #1E293B; stroke-width: 1.5; rx: 12px; }
      .term-header { fill: #111827; }
      .text-prompt { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 14px; fill: #38BDF8; font-weight: 600; }
      .text-cmd { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13.5px; fill: #F1F5F9; }
      .text-out { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #94A3B8; }
      .text-highlight { fill: #10B981; font-weight: 600; }
      .text-accent { fill: #C084FC; font-weight: 600; }
      .cursor { fill: #38BDF8; font-weight: 600; animation: blink 1s infinite; }
      @keyframes blink { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="190" class="term-bg"/>
  <rect width="900" height="34" rx="12" class="term-header"/>
  
  <circle cx="24" cy="17" r="6" fill="#EF4444"/>
  <circle cx="44" cy="17" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="17" r="6" fill="#10B981"/>
  <text x="450" y="22" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">ks-sss-ai@node [ru] ~ zsh</text>

  <g transform="translate(24, 66)">
    <text x="0" y="0" class="text-prompt">❯ </text>
    <text x="20" y="0" class="text-cmd">ks-sss-ai --init-agent --mode=autonomous-vibe --lang=ru</text>
    
    <text x="0" y="28" class="text-out">[+] <tspan class="text-highlight">Основные движки: Node.js / TypeScript / Python / Go — В сети</tspan></text>
    
    <text x="0" y="54" class="text-out">[+] <tspan class="text-accent">Архитектура: Многоузловой Zero-SPOF фейловер — Готов к работе</tspan></text>

    <!-- Line 4 with INLINE BLINKING PIPE CURSOR (Never overlaps) -->
    <text x="0" y="84" class="text-prompt">❯ </text>
    <text x="20" y="84" class="text-cmd">готов к созданию передовых систем<tspan class="cursor"> |<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>