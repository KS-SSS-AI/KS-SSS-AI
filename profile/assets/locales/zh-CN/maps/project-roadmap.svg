<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" fill="none" role="img" direction="ltr">
  <title>项目路线图</title>
  <desc>公开遥测 · 当前 / 下一阶段 / 未来</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="480" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17112B"/>
      <stop offset=".54" stop-color="#101926"/>
      <stop offset="1" stop-color="#0D1E1D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect x=".5" y=".5" width="479" height="399" rx="22" fill="url(#surface)" stroke="#30354A"/>
  <circle cx="424" cy="62" r="62" fill="#7C3AED" fill-opacity=".14" filter="url(#glow)"/>
  <circle cx="54" cy="358" r="66" fill="#06B6D4" fill-opacity=".09" filter="url(#glow)"/>

  <text x="24" y="31" fill="#F5F3FF" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="18" font-weight="700" text-anchor="start">项目路线图</text>
  <text x="24" y="49" fill="#AAB2C4" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="10" font-weight="400" text-anchor="start">公开遥测 · 当前 / 下一阶段 / 未来</text>

  <rect x="334" y="18" width="122" height="28" rx="14" fill="#0B1020" stroke="#67E8F9" stroke-opacity=".4"/>
