  <text x="365" y="36" fill="#EDE9FE" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="9" font-weight="700" text-anchor="start">自动刷新</text>

  <!-- Track rail -->
  <path d="M52 96V330" stroke="#4C4668" stroke-width="2" stroke-linecap="round"/>

  <!-- Card 1: NOW -->
  <circle cx="52" cy="112" r="9" fill="#111827" stroke="#67E8F9" stroke-width="2"/><circle cx="52" cy="112" r="3" fill="#67E8F9"/>
  <rect x="76" y="78" width="380" height="72" rx="15" fill="#111827" stroke="#67E8F9" stroke-opacity=".45"/>
  <text x="94" y="100" fill="#67E8F9" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="14" font-weight="700">当前 (NOW)</text>
  <text x="94" y="114" fill="#AAB2C4" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="9">02个公开项目</text>
  <text x="94" y="132" fill="#F5F3FF" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="11.5">#1 · github-org-map: 零知识 SHA-256 映射引擎</text>

