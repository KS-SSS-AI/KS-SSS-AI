  <text x="456" y="378" fill="#98A2B8" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="10" font-weight="400" text-anchor="end">状态基准 2026-09-20</text>
