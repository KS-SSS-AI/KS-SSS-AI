  <rect x="76" y="156" width="380" height="72" rx="15" fill="#111827" stroke="#C4B5FD" stroke-opacity=".45"/>
  <text x="94" y="178" fill="#C4B5FD" font-family="&apos;Microsoft YaHei&apos;, &apos;PingFang SC&apos;, sans-serif" font-size="14" font-weight="700">下一阶段 (NEXT)</text>
