      <text x="36" y="72" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• मल्टी-खाता 429 निरंतर फेलओवर</text>
<text x="36" y="90" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• डायनामिक टोकन रीयल-टाइम इंजेक्शन</text>
<text x="36" y="108" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5">• निरंतर एजेंट स्वायत्त निष्पादन</text>
