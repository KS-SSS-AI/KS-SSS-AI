  <text x="456" y="49" fill="#AAB2C4" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="10" font-weight="400" text-anchor="end">القياس العام · الآن / التالي / لاحقاً</text>

