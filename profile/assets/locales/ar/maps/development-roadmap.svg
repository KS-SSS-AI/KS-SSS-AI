<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" fill="none" role="img" direction="rtl">
  <title>خارطة طريق التطوير</title>
  <desc>مسار العمل · التخطيط / البناء / التحقق / النشر</desc>
  <defs>
    <linearGradient id="surface2" x1="0" y1="0" x2="480" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17112B"/>
      <stop offset=".54" stop-color="#101926"/>
      <stop offset="1" stop-color="#0D1E1D"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect x=".5" y=".5" width="479" height="419" rx="22" fill="url(#surface2)" stroke="#30354A"/>
  <circle cx="424" cy="62" r="62" fill="#7C3AED" fill-opacity=".14" filter="url(#glow2)"/>
  <circle cx="54" cy="378" r="66" fill="#06B6D4" fill-opacity=".09" filter="url(#glow2)"/>

  <text x="456" y="31" fill="#F5F3FF" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">خارطة طريق التطوير</text>
  <text x="456" y="49" fill="#AAB2C4" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="10" font-weight="400" text-anchor="end">مسار العمل · التخطيط / البناء / التحقق / النشر</text>

  <rect x="24" y="18" width="110" height="28" rx="14" fill="#0B1020" stroke="#C4B5FD" stroke-opacity=".42"/>
  <circle cx="43" cy="32" r="4" fill="#67E8F9"/>
  <text x="55" y="36" fill="#EDE9FE" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">عرض المسار</text>

  <!-- Track rail -->
  <path d="M428 96V342" stroke="#4C4668" stroke-width="2" stroke-linecap="round"/>

