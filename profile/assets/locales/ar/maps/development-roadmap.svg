  <rect x="24" y="203" width="380" height="58" rx="14" fill="#111827" stroke="#F9A8D4" stroke-opacity=".42"/>
  <text x="42" y="222" fill="#F9A8D4" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="13" font-weight="700">التحقق</text>
