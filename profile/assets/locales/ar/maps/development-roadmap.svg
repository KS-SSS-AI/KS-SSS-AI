  <!-- Stage 4: SHIP -->
  <circle cx="428" cy="292" r="9" fill="#111827" stroke="#A7F3D0" stroke-width="2"/><circle cx="428" cy="292" r="3" fill="#A7F3D0"/>
  <rect x="24" y="265" width="380" height="58" rx="14" fill="#111827" stroke="#A7F3D0" stroke-opacity=".42"/>
  <text x="42" y="284" fill="#A7F3D0" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="13" font-weight="700">النشر</text>
