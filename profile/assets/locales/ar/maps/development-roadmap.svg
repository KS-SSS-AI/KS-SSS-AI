  <text x="42" y="120" fill="#F5F3FF" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="11">معمارية موزعة عالية التوافر خالية من العطل الأحادي</text>

