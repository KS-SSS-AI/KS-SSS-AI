  <path d="M24 380H456" stroke="#30354A"/>
  <text x="456" y="398" fill="#A7F3D0" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end">البيانات العامة فقط</text>
  <text x="24" y="398" fill="#98A2B8" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">الحالة حتى 2026-09-20</text>
