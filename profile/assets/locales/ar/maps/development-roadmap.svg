  <circle cx="428" cy="168" r="9" fill="#111827" stroke="#67E8F9" stroke-width="2"/><circle cx="428" cy="168" r="3" fill="#67E8F9"/>
  <rect x="24" y="141" width="380" height="58" rx="14" fill="#111827" stroke="#67E8F9" stroke-opacity=".42"/>
  <text x="42" y="160" fill="#67E8F9" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="13" font-weight="700">البناء</text>
  <text x="42" y="182" fill="#F5F3FF" font-family="&apos;Segoe UI&apos;, &apos;Tahoma&apos;, Arial, sans-serif" font-size="11">محرك الخرائط المزدوج ونواة الوكلاء الذاتية</text>

