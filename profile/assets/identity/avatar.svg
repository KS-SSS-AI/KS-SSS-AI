<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="120" fill="#0A0E17"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyberGrad)" stroke-width="6" stroke-dasharray="24 12" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="165" fill="#0E1626" stroke="#1E293B" stroke-width="3"/>

  <!-- Core Monogram S-Curves -->
  <g filter="url(#neonGlow)" fill="url(#glyphGrad)">
    <!-- Top Curve -->
    <path d="M 180 180 C 180 140, 332 140, 332 180 C 332 210, 280 220, 256 230 C 210 245, 170 270, 170 320 C 170 370, 336 370, 336 320 L 296 320 C 296 342, 212 342, 212 320 C 212 295, 260 280, 284 270 C 330 255, 372 235, 372 180 C 372 110, 140 110, 140 180 Z" />
    
    <!-- Accent Triple Lines (SSS Symbolism) -->
    <rect x="360" y="140" width="12" height="12" rx="3" fill="#00F2FE"/>
    <rect x="380" y="140" width="12" height="12" rx="3" fill="#4FACFE"/>
    <rect x="400" y="140" width="12" height="12" rx="3" fill="#8B5CF6"/>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="410" cy="102" r="14" fill="#00F2FE" filter="url(#neonGlow)"/>
  <circle cx="410" cy="102" r="6" fill="#FFFFFF"/>
</svg>